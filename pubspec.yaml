# dev_dependencies:
#   flutter_test:
#     sdk: flutter
#   archive: ^4.0.7
#   freezed: ^3.0.2
#   build_runner: ^2.4.14
#   icons_launcher: ^3.1.0

#   json_serializable: ^6.14.0

