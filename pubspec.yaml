dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.0.2
  build_runner: ^2.4.14
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.3
  flutter_lints: ^6.0.0
  # انقليها إلى هنا بهذا الإصدار المتوافق:
  icons_launcher: ^3.0.0


flutter:
  uses-material-design: true


  assets:
    - assets/themes/light_theme.json
    - assets/translation/
    - assets/images/
    - assets/svg/
    - assets/json/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf

# icons_launcher:
#   image_path: "assets/images/logo.png"
#   platforms:
#     android:
#       enable: true
#     web:
#       enable: true
icons_launcher:
  image_path: "assets/images/logo.png" # ستبقى كمرجع عام أو للويب
  platforms:
    android:
      enable: true
      # 🌟 استخدام الأيقونات المتكيفة للأندرويد لتعطيكِ تحكماً كاملاً بالحجم
      adaptive_icon_background: "#FFFFFF" # لون الخلفية (يمكنكِ وضع لون ثيم التطبيق مثلاً)
      adaptive_icon_foreground: "assets/images/logo.png" # الشعار هنا سيتمدد بشكل أفضل
    web:
      enable: true

  uses-material-design: true

# dependency_overrides:
#   analyzer: ^9.0.0
#   meta: 1.17.0
dependency_overrides:
  analyzer: ^9.0.0
  meta: 1.17.0